# MultiForge client debug mod. Loads on any vanilla NeoForge 1.21.x
# client; opens the multiforge:debug/v1 channel when connecting to a
# MultiForge server and shows the F3 overlay + chunk borders + heatmap +
# pin selection boxes + violation side panel.
modLoader = "javafml"
loaderVersion = "[4,)"
license = "GPL-3.0-only"
issueTrackerURL = "https://github.com/0xnullsect0r/MultiForge/issues"

[[mods]]
modId = "multiforge_debug"
version = "${version}"
displayName = "MultiForge Debug Client"
description = '''
Client-side debug overlay for MultiForge servers. Shows region ids, MSPT
and owned entity counts, a per-region detail list, real region-ownership
seams between chunks, a tick-cost heatmap, pinned region selection boxes,
and a live reroute/warn violation panel. Every overlay is individually
switchable from the config screen, with F6 as a master toggle.
Load on any vanilla NeoForge 1.21.x client — the panel stays inert if
the server does not advertise multiforge:debug/v1.
'''
authors = "MultiForge authors"

[[dependencies.multiforge_debug]]
modId = "neoforge"
type = "required"
versionRange = "[21.1,)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.multiforge_debug]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.1,1.22)"
ordering = "NONE"
side = "CLIENT"
