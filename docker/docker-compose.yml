# Minimal MultiForge server compose file.
# See docs/license.md for how to obtain a MULTIFORGE_LICENSE token.

services:
  multiforge:
    image: ghcr.io/0xnullsect0r/multiforge-server:1.0.0
    container_name: multiforge
    restart: unless-stopped
    ports:
      - "25565:25565/tcp"
      - "25565:25565/udp"
    environment:
      EULA: "TRUE"
      MEMORY: "8G"
      MULTIFORGE_LICENSE: "${MULTIFORGE_LICENSE:?set MULTIFORGE_LICENSE in your environment or .env file}"
      MULTIFORGE_MODE: "hybrid"
      MULTIFORGE_CORES: "8"
      MULTIFORGE_THREADS_PER_CORE: "2"
    volumes:
      - ./data:/data
    healthcheck:
      # Real Minecraft server-list-ping probe (mcstatus is installed in the
      # image, see docker/Dockerfile). Exit code reflects whether the
      # server actually answered the ping — no `|| exit 0` fallback, so a
      # down server is correctly reported unhealthy.
      test: ["CMD", "mcstatus", "127.0.0.1:25565", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
