# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
# This is required to provide enough memory for recompilation
# (see also projects/neoforged/build.gradle, where the compile tasks is set to have enough memory when forked)
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.debug=false
#org.gradle.warning.mode=fail

# renovate: net.neoforged:moddev-gradle
moddevgradle_plugin_version=2.0.140
# renovate: io.codechicken:DiffPatch
diffpatch_version=2.1.0.43

java_version=25

minecraft_version=26.1.2
neoform_version=1
# on snapshot versions, used to prefix the version
# should always have 3 components (major.minor.hotfix)
neoforge_snapshot_next_stable=26.1.2

# renovate: net.neoforged.jst:jst-cli-bundle
jst_version=1.0.67
legacyinstaller_version=3.0.+
# renovate: net.neoforged.installertools:installertools
installertools_version=4.0.12

# renovate: org.ow2.asm:asm
asm_version=9.9.1

# The upstream NeoForge release this fork's sources are based on: commit
# 0e715c5ab499cfde5fe98683c87f6564c4f34b9d (26.1.x). The fork reports this as
# its `neoforge` mod version, and every mod's `neoforge` dependency range is
# checked against it (see build.gradle).
neoforge_base_version=26.1.2.129

# MultiForge fork addition: the multiforge-runtime version this build belongs
# to. Keep in sync with the outer repo's gradle.properties `version=`.
multiforge_runtime_version=2.0.0-alpha.1
# PROXY protocol decoder (Apache-2.0): must equal the Netty version Minecraft ships.
multiforge_netty_haproxy_version=4.2.7.Final

# MultiForge fork addition: how much of MultiForge this tree carries.
#   false    stock NeoForge
#   partial  some patch groups are ported (multiforge-patches/NN-*; the 1.21.1
#            set is the spec in multiforge-patches/spec-1.21.1). NOT safe to
#            ship: the release workflow and the nightly refuse it.
#   true     every group is ported and verified (port step 8)
multiforge_patches_enabled=partial
# Required GameTests this tree must pass in CI (hybrid and strict).
multiforge_min_required_gametests=258

mergetool_version=2.0.0
accesstransformers_version=11.0.1
eventbus_version=8.0.5
mixin_version=0.17.4+mixin.0.8.7
terminalconsoleappender_version=1.3.0
nightconfig_version=3.8.3
jetbrains_annotations_version=24.0.1
apache_maven_artifact_version=3.9.9
jarjar_version=0.4.1
fancy_mod_loader_version=11.0.15
typetools_version=0.6.3
mixin_extras_version=0.5.5

jupiter_api_version=5.13.4
vintage_engine_version=5.+
assertj_core=3.25.1

# renovate: org.eclipse.jdt:org.eclipse.jdt.core
jdt_core_version=3.42.0

neogradle.runtime.platform.installer.debug=true
