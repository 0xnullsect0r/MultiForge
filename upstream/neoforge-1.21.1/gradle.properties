# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
# This is required to provide enough memory for the Minecraft decompilation process.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false
org.gradle.debug=false

java_version=21

minecraft_version=1.21.1
neoform_version=20240808.144430
# on snapshot versions, used to prefix the version
neoforge_snapshot_next_stable=22.0

# The upstream NeoForge release this fork's sources were vendored from.
#
# This is what the fork REPORTS as its `neoforge` mod version, and every
# mod's `neoforge` dependency range is checked against it. Get it wrong
# in either direction and things break:
#
#   too low  -> mods that would actually work are rejected at load
#   too high -> mods load, then die on NoSuchMethodError when they call
#               an API added after this base
#
# Through v1.5.0 the fork reported `1.21.1-v<tag>-beta`, which is not a
# NeoForge version at all: Maven compares its leading `1` against the
# `21` in a range like [21.1.152,) and rejects it, so EVERY mod was
# refused — including ones needing only [21.1.0,). See build.gradle.
#
# Established by diffing this tree's src/main/java/net/neoforged against
# NeoForge's published sources jars: 902 of 905 files are byte-identical
# to 21.1.1, and the only three that differ (NeoForge.java,
# NeoForgeMod.java, ServerLifecycleHooks.java) are MultiForge's own
# fork-side edits. The match degrades monotonically with distance —
# 893/905 at 21.1.9, 881 at 21.1.20, 762 at 21.1.234 — so the base is
# 21.1.1, the first 1.21.1 release.
#
# Note this contradicts the outer repo's `neoForgeVersion=21.1.90`, and
# the pins in this file (coremods 6.0.4, mergetool 2.0.0) match no
# published 21.1.x at all; both were stale. The source diff is
# authoritative.
#
# Consequence: mods requiring anything above 21.1.1 are refused. For
# ATM10 that is 117 of 192. Raising this without actually rebasing the
# sources would let those mods load and then die on NoSuchMethodError,
# which is strictly worse than a clean rejection. Raise it only as part
# of a real rebase.
neoforge_base_version=21.1.1

# MultiForge fork addition: coordinate + version of the multiforge-runtime
# artifact this build depends on (see projects/neoforge/build.gradle),
# published via `./gradlew :multiforge-runtime:publishToMavenLocal` from
# the outer repo root. Keep in sync with the outer repo's gradle.properties
# `version=` until M8 replaces this mavenLocal round-trip with something
# better (see docs/blueprint.md M7 open questions).
multiforge_runtime_version=1.5.1

