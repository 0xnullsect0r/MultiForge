// MultiForge fork addition (not part of upstream NeoForge).
//
// Applies MultiForge's own patches (../../../multiforge-patches/<NN-group>/**/*.patch,
// relative to this file) on top of the already NeoForge-patched vanilla source that
// NeoDev's `setup` task materializes into src/main/java. Patch groups are applied
// in directory-name order (01-ownership, 02-region-tick, ...) so later groups can assume
// earlier ones already landed.
//
// Anchor point: runs after NeoDev's `setup` (which syncs the NeoForge-patched sources
// into src/main/java) and before compileJava.
//
// Every Minecraft class is present in src/main/java after setup. The `:base` seeding
// fallback in the applier below is kept for older layouts where only NeoForge-patched
// classes were materialised there.
//
// MultiForge fork addition (M12.2): `net/neoforged/**` (NeoForge's own hand-written mod
// source, e.g. NeoForge.java) and `net/multiforge/**` are NOT part of the NeoDev
// decompile/patch pipeline at all — they live only in this outer repo's committed,
// hand-maintained tree at rootProject's `src/main/java` (see this project's `sourceSets`
// block a few lines below `apply from: 'multiforge-patches.gradle'`, which points
// `sourceSets.main.java.srcDirs` there instead of the conventional
// `projects/neoforge/src/main/java`). A patch targeting one of those paths (the first
// being `09-events/net/neoforged/neoforge/common/NeoForge.java.patch`) must therefore
// apply against that committed tree, not the freshly-regenerated-by-:setup one — the
// target file simply does not exist under `neoforgeSrcMainJava` for anything outside
// `net/minecraft/**`. See `applyTargetDirFor` below.
// Both tasks are written as task classes with every input declared, and no
// reference to the build script or the project at execution, so they work with
// Gradle's configuration cache (which NeoForge's own production test tasks need).

import java.nio.file.Files
import java.security.MessageDigest
import javax.inject.Inject
import org.gradle.api.DefaultTask
import org.gradle.api.GradleException
import org.gradle.api.file.ConfigurableFileCollection
import org.gradle.api.file.DirectoryProperty
import org.gradle.api.provider.Property
import org.gradle.api.tasks.Internal
import org.gradle.api.tasks.TaskAction
import org.gradle.api.tasks.Classpath

// Idempotence: several groups patch the same file (ServerLevel, Level, ...), so
// "is this one patch already applied?" cannot be answered per patch once a later
// group has changed that patch's context. Instead the applier works per target
// file: it keeps a pristine copy of every net/minecraft target under
// build/multiforge-pristine/ plus the SHA-256 of the output it last produced.
// On each run, a target whose current content still equals that recorded
// output is ours, so it is restored from the pristine copy; anything else is a
// freshly materialised source (setup rewrote it), which becomes the new
// pristine copy. Then every group is applied in order. This makes the task
// safe to run any number of times, alone or as part of compileJava, and
// picks up edited patches. Targets outside net/minecraft (the committed
// net/neoforged tree) are applied once and skipped when already applied.
abstract class MultiforgeApplyPatches extends DefaultTask {
    // Only `net/minecraft/**` paths are part of the setup-regenerated tree (and thus
    // eligible for the :base seeding fallback) — everything else (`net/neoforged/**`,
    // `net/multiforge/**`) is hand-maintained source committed in this outer repo.
    @Internal abstract DirectoryProperty getPatchesRoot()
    @Internal abstract DirectoryProperty getNeoforgeSources()
    @Internal abstract DirectoryProperty getBaseSources()
    @Internal abstract DirectoryProperty getCommittedSources()
    @Internal abstract DirectoryProperty getPristineRoot()

    static String sha256Of(File f) {
        MessageDigest.getInstance('SHA-256').digest(f.bytes).encodeHex().toString()
    }

    static String patchTargetOf(File patchFile) {
        def firstLine = patchFile.readLines().find { it.startsWith('--- a/') || it.startsWith('--- ') }
        if (firstLine == null) return null
        String targetRel = firstLine.replaceFirst(/^---\s+a?\//, '').replaceFirst(/^---\s+/, '').trim()
        int tab = targetRel.indexOf('\t')
        return tab >= 0 ? targetRel.substring(0, tab) : targetRel
    }

    /** Runs `git apply <args> <patch>` in {@code dir}; returns [exit code, stderr]. */
    static List gitApply(File dir, List<String> args, File patch) {
        def cmd = ['git', 'apply'] + args + [patch.absolutePath]
        def proc = new ProcessBuilder(cmd).directory(dir).redirectErrorStream(true).start()
        String out = proc.inputStream.text
        return [proc.waitFor(), out]
    }

    @TaskAction
    void apply() {
        File multiforgePatchesRoot = patchesRoot.get().asFile
        File neoforgeSrcMainJava = neoforgeSources.get().asFile
        File baseSrcMainJava = baseSources.get().asFile
        File mfCommittedSrcMainJava = committedSources.get().asFile
        File pristineDir = pristineRoot.get().asFile
        File appliedHashes = new File(pristineDir, 'applied-output.sha256')
        def applyTargetDirFor = { String targetRel ->
            targetRel != null && targetRel.startsWith('net/minecraft/') ? neoforgeSrcMainJava : mfCommittedSrcMainJava
        }

        if (!multiforgePatchesRoot.exists()) {
            logger.lifecycle("MultiForge: no multiforge-patches directory at ${multiforgePatchesRoot} — nothing to apply.")
            return
        }
        if (!neoforgeSrcMainJava.exists()) {
            throw new GradleException(
                "MultiForge: ${neoforgeSrcMainJava} does not exist yet — run the NeoForge 'setup' task first " +
                "(cd upstream/neoforge-1.21.1 && ./gradlew setup).")
        }

        def groups = multiforgePatchesRoot.listFiles({ f -> f.isDirectory() } as FileFilter)?.sort { it.name } ?: []
        def ordered = []
        groups.each { group ->
            def patches = []
            Files.walk(group.toPath()).withCloseable { stream ->
                stream.filter { it.toString().endsWith('.patch') && Files.isRegularFile(it) }.forEach { patches << it.toFile() }
            }
            patches.sort { it.path }.each { ordered << [group, it] }
        }

        // 1. Reset every net/minecraft target to its pristine content.
        def recorded = [:]
        def recordedSeeded = [] as Set
        if (appliedHashes.exists()) {
            appliedHashes.eachLine { line ->
                def parts = line.split('  ')
                if (parts.length >= 2) recorded[parts[1]] = parts[0]
                if (parts.length >= 3 && parts[2] == 'seeded') recordedSeeded << parts[1]
            }
        } else if (pristineDir.exists() && new File(pristineDir, 'net').exists()) {
            // Pristine copies without a record: the build directory was half-cleaned. The
            // sources under src/main/java may still be patched, so they cannot be trusted
            // as pristine; `setup` regenerates them.
            logger.warn("MultiForge: ${appliedHashes} is missing; if a patch then fails to apply, run `./gradlew setup` again.")
        }
        def mcTargets = ordered.collect { patchTargetOf(it[1]) }.findAll { it != null && it.startsWith('net/minecraft/') }.unique()
        int restored = 0
        int seeded = 0
        def seededNow = [] as Set
        // A file patched last time but no longer targeted goes back to what it was
        // before MultiForge touched it: deleted if it was seeded from :base, restored
        // from its pristine copy otherwise.
        recorded.keySet().findAll { !mcTargets.contains(it) }.each { String stale ->
            def target = new File(neoforgeSrcMainJava, stale)
            def pristine = new File(pristineDir, stale)
            if (target.exists() && sha256Of(target) == recorded[stale]) {
                if (recordedSeeded.contains(stale)) target.delete()
                else if (pristine.exists()) target.bytes = pristine.bytes
                restored++
            }
            pristine.delete()
        }
        mcTargets.each { String targetRel ->
            def target = new File(neoforgeSrcMainJava, targetRel)
            def pristine = new File(pristineDir, targetRel)
            if (target.exists() && recorded[targetRel] != null && sha256Of(target) == recorded[targetRel] && pristine.exists()) {
                target.bytes = pristine.bytes
                if (recordedSeeded.contains(targetRel)) seededNow << targetRel
                restored++
            } else if (target.exists()) {
                pristine.parentFile.mkdirs()
                pristine.bytes = target.bytes
            } else {
                // NeoForge does not patch this Vanilla file, so it only exists in :base.
                def baseTarget = new File(baseSrcMainJava, targetRel)
                if (!baseTarget.exists()) {
                    throw new GradleException("MultiForge: patch target ${targetRel} exists in neither :neoforge nor :base")
                }
                target.parentFile.mkdirs()
                target.bytes = baseTarget.bytes
                pristine.parentFile.mkdirs()
                pristine.bytes = baseTarget.bytes
                seededNow << targetRel
                seeded++
            }
        }

        // 2. Apply every group in order.
        int applied = 0
        int skipped = 0
        // A failed apply must not leave targets half-patched: the next run has no
        // record of them and would take them for fresh pristine sources.
        def restoreAllTargets = {
            appliedHashes.delete()
            mcTargets.each { String targetRel ->
                def target = new File(neoforgeSrcMainJava, targetRel)
                def pristine = new File(pristineDir, targetRel)
                if (seededNow.contains(targetRel)) target.delete()
                else if (pristine.exists()) target.bytes = pristine.bytes
            }
        }
        ordered.each { group, File patchFile ->
            String targetRel = patchTargetOf(patchFile)
            File targetDir = applyTargetDirFor(targetRel)
            def check = gitApply(targetDir, ['--check', '--recount'], patchFile)
            if (check[0] == 0) {
                def result = gitApply(targetDir, ['--recount'], patchFile)
                if (result[0] != 0) {
                    restoreAllTargets()
                    throw new GradleException("MultiForge: patch ${group.name}/${patchFile.name} failed to apply:\n${result[1]}")
                }
                applied++
                return
            }
            if (targetDir != neoforgeSrcMainJava && gitApply(targetDir, ['--reverse', '--check', '--recount'], patchFile)[0] == 0) {
                skipped++
                return
            }
            restoreAllTargets()
            throw new GradleException(
                "MultiForge: patch ${group.name}/${patchFile.name} does not apply to ${targetRel}:\n${check[1]}\n" +
                "Every net/minecraft target was restored to its pristine copy. If src/main/java was cleaned or " +
                "edited by hand, run `./gradlew setup` again.")
        }

        // 3. Record what we produced, so the next run recognises it.
        appliedHashes.parentFile.mkdirs()
        appliedHashes.text = mcTargets.collect {
            "${sha256Of(new File(neoforgeSrcMainJava, it))}  ${it}" + (seededNow.contains(it) ? '  seeded' : '')
        }.join('\n') + '\n'
        logger.lifecycle("MultiForge: ${applied} patch(es) applied (${restored} target(s) reset to pristine, " +
                "${seeded} seeded from :base), ${skipped} committed-tree patch(es) already present.")
    }
}

// Mixin-target parity. Mods' mixins name the Vanilla members they inject into,
// including synthetic lambda methods (lambda$tick$2), which javac numbers in
// source order, and the fields they @Shadow or @Accessor. A MultiForge patch that
// adds a lambda to a Vanilla class, moves a Vanilla body into another method,
// changes what a Vanilla lambda captures, or removes or retypes a field breaks
// every mixin aimed at it (Lithium and Ad Astra both failed this way). This
// compiles the pristine copy of each patched file against the fork and fails if
// any method or field it declares is missing from MultiForge's class or has a
// different descriptor, unless multiforge-patches/mixin-target-exceptions.txt
// lists it with a reason.
abstract class MultiforgeCheckMixinTargets extends DefaultTask {
    @Internal abstract DirectoryProperty getPristineRoot()
    @Internal abstract DirectoryProperty getClassesDir()
    @Internal abstract DirectoryProperty getOutDir()
    @Internal abstract Property<File> getAllowedFile()
    @Classpath abstract ConfigurableFileCollection getCompileClasspath()

    static Set<String> members(File f) {
        def out = [] as Set
        new org.objectweb.asm.ClassReader(f.bytes).accept(new org.objectweb.asm.ClassVisitor(org.objectweb.asm.Opcodes.ASM9) {
            @Override
            org.objectweb.asm.MethodVisitor visitMethod(int access, String name, String desc, String sig, String[] ex) {
                out << "${name}${desc}".toString()
                return null
            }

            @Override
            org.objectweb.asm.FieldVisitor visitField(int access, String name, String desc, String sig, Object value) {
                out << "field ${name} ${desc}".toString()
                return null
            }
        }, org.objectweb.asm.ClassReader.SKIP_CODE)
        out
    }

    @TaskAction
    void check() {
        File pristineDir = pristineRoot.get().asFile
        File classes = classesDir.get().asFile
        File out = outDir.get().asFile
        File allowed = allowedFile.get()
        def allowedChanges = (allowed.exists() ? allowed.readLines() : [])
                .collect { it.trim() }
                .findAll { it && !it.startsWith('#') } as Set
        def sources = []
        if (pristineDir.exists()) {
            pristineDir.eachFileRecurse(groovy.io.FileType.FILES) { if (it.name.endsWith('.java')) sources << it }
        }
        if (sources.isEmpty()) throw new GradleException('MultiForge: no pristine sources — run :neoforge:applyMultiforgePatches first')
        out.deleteDir()
        out.mkdirs()
        def cp = ([classes] + compileClasspath.files).collect { it.absolutePath }.join(File.pathSeparator)
        def javac = javax.tools.ToolProvider.getSystemJavaCompiler()
        def args = ['-proc:none', '-nowarn', '-g:none', '--release', '21', '-encoding', 'UTF-8', '-cp', cp, '-d', out.absolutePath] +
                sources.collect { it.absolutePath }
        def err = new ByteArrayOutputStream()
        if (javac.run(null, null, err, args as String[]) != 0) {
            throw new GradleException("MultiForge: pristine sources did not compile:\n${err.toString().readLines().take(40).join('\n')}")
        }
        def problems = []
        int checked = 0
        out.eachFileRecurse(groovy.io.FileType.FILES) { pristineClass ->
            if (!pristineClass.name.endsWith('.class')) return
            def rel = out.toPath().relativize(pristineClass.toPath()).toString().replace(File.separatorChar, '/' as char)
            def ours = new File(classes, rel)
            checked++
            if (!ours.exists()) { problems << "${rel}: class missing"; return }
            def lost = members(pristineClass) - members(ours)
            lost.sort().each { m ->
                if (!allowedChanges.contains("${rel}: ${m}".toString())) problems << "${rel}: ${m}"
            }
        }
        if (!problems.isEmpty()) {
            throw new GradleException("MultiForge: ${problems.size()} Vanilla member(s) missing or changed in patched classes " +
                    "(mixins targeting them will fail to apply):\n  " + problems.join('\n  '))
        }
        logger.lifecycle("MultiForge: mixin targets intact in ${checked} patched class(es).")
    }
}

def applyMultiforgePatches = tasks.register('applyMultiforgePatches', MultiforgeApplyPatches) {
    group = 'multiforge'
    description = 'Applies multiforge-patches/<NN-group>/**/*.patch on top of the patched vanilla source.'
    patchesRoot.set(rootProject.layout.projectDirectory.dir('../../multiforge-patches'))
    neoforgeSources.set(project.layout.projectDirectory.dir('src/main/java'))
    baseSources.set(rootProject.layout.projectDirectory.dir('projects/base/src/main/java'))
    committedSources.set(rootProject.layout.projectDirectory.dir('src/main/java'))
    pristineRoot.set(project.layout.buildDirectory.dir('multiforge-pristine'))
    // Always runs: it decides itself what to restore and re-apply.
    outputs.upToDateWhen { false }
}

// NeoDev's `setup` syncs the NeoForge-patched Minecraft sources into
// src/main/java (replacing whatever was there); the applier runs after it.
tasks.named('applyMultiforgePatches').configure {
    mustRunAfter('setup')
}

// Compilation and the production source patches both read the MultiForge-patched
// tree. generateProductionSourcePatches diffs src/main/java against the clean
// sources, and the binary-patch tasks use that diff as their class whitelist, so
// every class a MultiForge patch touches ships in the installer's binpatches.
['compileJava', 'generateProductionSourcePatches'].each { taskName ->
    tasks.named(taskName).configure {
        dependsOn(applyMultiforgePatches)
    }
}

tasks.register('checkMixinTargets', MultiforgeCheckMixinTargets) {
    group = 'verification'
    description = 'Checks that MultiForge patches keep every method, lambda and field of the Vanilla classes they patch.'
    dependsOn('compileJava')
    pristineRoot.set(project.layout.buildDirectory.dir('multiforge-pristine'))
    classesDir.set(sourceSets.main.java.destinationDirectory)
    outDir.set(project.layout.buildDirectory.dir('multiforge-pristine-classes'))
    allowedFile.set(rootProject.file('../../multiforge-patches/mixin-target-exceptions.txt'))
    compileClasspath.from(sourceSets.main.compileClasspath)
    outputs.upToDateWhen { false }
}
