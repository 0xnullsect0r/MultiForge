// MultiForge fork addition (not part of upstream NeoForge).
//
// Applies MultiForge's own patches (../../../multiforge-patches/<NN-group>/**/*.patch,
// relative to this file) on top of the already NeoForge-patched vanilla source that
// NeoGradle's platform plugin materializes into src/main/java. Patch groups are applied
// in directory-name order (01-ownership, 02-region-tick, ...) so later groups can assume
// earlier ones already landed.
//
// Anchor point: this task must run after the real NeoGradle task that writes the final
// patched vanilla source to disk, empirically confirmed (via a real `:setup` run's task
// log, not guessed) to be
// "platformJoined${minecraft_version}-${neoform_version}SourceFromAppliedPatches", and
// before compileJava.
//
// Source-location note: NeoGradle's `:neoforge` project's `src/main/java/` only receives
// files that NeoForge itself patches; unpatched-by-NeoForge Vanilla classes stay in
// `:base`'s `src/main/java/`. Since some MultiForge patches target files NeoForge doesn't
// touch (e.g. ChunkHolder.java, ProcessorMailbox.java), the applier below copies the file
// from `:base` into `:neoforge` on first touch so the patch's target path exists.
//
// MultiForge fork addition (M12.2): `net/neoforged/**` (NeoForge's own hand-written mod
// source, e.g. NeoForge.java) and `net/multiforge/**` are NOT part of the NeoGradle
// decompile/patch pipeline at all — they live only in this outer repo's committed,
// hand-maintained tree at rootProject's `src/main/java` (see this project's `sourceSets`
// block a few lines below `apply from: 'multiforge-patches.gradle'`, which points
// `sourceSets.main.java.srcDirs` there instead of the NeoGradle-conventional
// `projects/neoforge/src/main/java`). A patch targeting one of those paths (the first
// being `09-events/net/neoforged/neoforge/common/NeoForge.java.patch`) must therefore
// apply against that committed tree, not the freshly-regenerated-by-:setup one — the
// target file simply does not exist under `neoforgeSrcMainJava` for anything outside
// `net/minecraft/**`. See `applyTargetDirFor` below.
def multiforgePatchesRoot = rootProject.layout.projectDirectory.dir('../../multiforge-patches').asFile
def neoforgeSrcMainJava = project.file('src/main/java')
def baseSrcMainJava = rootProject.layout.projectDirectory.dir('projects/base/src/main/java').asFile
def mfCommittedSrcMainJava = rootProject.file('src/main/java')

// Picks which of the two real source roots a given patch target lives under. Only
// `net/minecraft/**` paths are part of the NeoGradle-regenerated tree (and thus eligible
// for the :base seeding fallback below) — everything else (`net/neoforged/**`,
// `net/multiforge/**`) is hand-maintained source committed directly in this outer repo.
def applyTargetDirFor = { String targetRel ->
    targetRel != null && targetRel.startsWith('net/minecraft/') ? neoforgeSrcMainJava : mfCommittedSrcMainJava
}

// Idempotence: several groups patch the same file (ServerLevel, Level, ...), so
// "is this one patch already applied?" cannot be answered per patch once a later
// group has changed that patch's context. Instead the applier works per target
// file: it keeps a pristine copy of every net/minecraft target under
// build/multiforge-pristine/ plus the SHA-256 of the output it last produced.
// On each run, a target whose current content still equals that recorded
// output is ours, so it is restored from the pristine copy; anything else is a
// freshly materialised source (setup rewrote it), which becomes the new
// pristine copy. Then every group is applied in order. This makes the task
// safe to run any number of times, alone or as part of compileJava, and
// picks up edited patches. Targets outside net/minecraft (the committed
// net/neoforged tree) are applied once and skipped when already applied.
def pristineRoot = project.layout.buildDirectory.dir('multiforge-pristine').get().asFile
def appliedHashes = new File(pristineRoot, 'applied-output.sha256')

def sha256Of = { File f ->
    java.security.MessageDigest.getInstance('SHA-256').digest(f.bytes).encodeHex().toString()
}

def patchTargetOf = { File patchFile ->
    def firstLine = patchFile.readLines().find { it.startsWith('--- a/') || it.startsWith('--- ') }
    if (firstLine == null) return null
    String targetRel = firstLine.replaceFirst(/^---\s+a?\//, '').replaceFirst(/^---\s+/, '').trim()
    int tab = targetRel.indexOf('\t')
    return tab >= 0 ? targetRel.substring(0, tab) : targetRel
}

def applyMultiforgePatches = tasks.register('applyMultiforgePatches') {
    group = 'multiforge'
    description = 'Applies multiforge-patches/<NN-group>/**/*.patch on top of the patched vanilla source.'

    doLast {
        if (!multiforgePatchesRoot.exists()) {
            logger.lifecycle("MultiForge: no multiforge-patches directory at ${multiforgePatchesRoot} — nothing to apply.")
            return
        }
        if (!neoforgeSrcMainJava.exists()) {
            throw new GradleException(
                "MultiForge: ${neoforgeSrcMainJava} does not exist yet — run the NeoForge 'setup' task first " +
                "(cd upstream/neoforge-1.21.1 && ./gradlew --no-configuration-cache setup).")
        }

        def groups = multiforgePatchesRoot.listFiles({ f -> f.isDirectory() } as FileFilter)?.sort { it.name } ?: []
        def ordered = []
        groups.each { group ->
            fileTree(dir: group, include: '**/*.patch').files.sort { it.path }.each { ordered << [group, it] }
        }

        // 1. Reset every net/minecraft target to its pristine content.
        def recorded = [:]
        def recordedSeeded = [] as Set
        if (appliedHashes.exists()) {
            appliedHashes.eachLine { line ->
                def parts = line.split('  ')
                if (parts.length >= 2) recorded[parts[1]] = parts[0]
                if (parts.length >= 3 && parts[2] == 'seeded') recordedSeeded << parts[1]
            }
        }
        def mcTargets = ordered.collect { patchTargetOf(it[1]) }.findAll { it != null && it.startsWith('net/minecraft/') }.unique()
        int restored = 0
        int seeded = 0
        def seededNow = [] as Set
        // A file patched last time but no longer targeted goes back to what it was
        // before MultiForge touched it: deleted if it was seeded from :base, restored
        // from its pristine copy otherwise.
        recorded.keySet().findAll { !mcTargets.contains(it) }.each { String stale ->
            def target = new File(neoforgeSrcMainJava, stale)
            def pristine = new File(pristineRoot, stale)
            if (target.exists() && sha256Of(target) == recorded[stale]) {
                if (recordedSeeded.contains(stale)) target.delete()
                else if (pristine.exists()) target.bytes = pristine.bytes
                restored++
            }
            pristine.delete()
        }
        mcTargets.each { String targetRel ->
            def target = new File(neoforgeSrcMainJava, targetRel)
            def pristine = new File(pristineRoot, targetRel)
            if (target.exists() && recorded[targetRel] != null && sha256Of(target) == recorded[targetRel] && pristine.exists()) {
                target.bytes = pristine.bytes
                if (recordedSeeded.contains(targetRel)) seededNow << targetRel
                restored++
            } else if (target.exists()) {
                pristine.parentFile.mkdirs()
                pristine.bytes = target.bytes
            } else {
                // NeoForge does not patch this Vanilla file, so it only exists in :base.
                def baseTarget = new File(baseSrcMainJava, targetRel)
                if (!baseTarget.exists()) {
                    throw new GradleException("MultiForge: patch target ${targetRel} exists in neither :neoforge nor :base")
                }
                target.parentFile.mkdirs()
                target.bytes = baseTarget.bytes
                pristine.parentFile.mkdirs()
                pristine.bytes = baseTarget.bytes
                seededNow << targetRel
                seeded++
            }
        }

        // 2. Apply every group in order.
        int applied = 0
        int skipped = 0
        ordered.each { group, File patchFile ->
            String targetRel = patchTargetOf(patchFile)
            def targetDir = applyTargetDirFor(targetRel)
            def checkResult = exec {
                workingDir = targetDir
                commandLine = ['git', 'apply', '--check', '--recount', patchFile.absolutePath]
                ignoreExitValue = true
                standardOutput = new ByteArrayOutputStream()
                errorOutput = new ByteArrayOutputStream()
            }
            if (checkResult.exitValue == 0) {
                exec {
                    workingDir = targetDir
                    commandLine = ['git', 'apply', '--recount', patchFile.absolutePath]
                }
                applied++
                return
            }
            if (targetDir != neoforgeSrcMainJava) {
                def reverseCheck = exec {
                    workingDir = targetDir
                    commandLine = ['git', 'apply', '--reverse', '--check', '--recount', patchFile.absolutePath]
                    ignoreExitValue = true
                    standardOutput = new ByteArrayOutputStream()
                    errorOutput = new ByteArrayOutputStream()
                }
                if (reverseCheck.exitValue == 0) {
                    skipped++
                    return
                }
            }
            def err = new ByteArrayOutputStream()
            exec {
                workingDir = targetDir
                commandLine = ['git', 'apply', '--check', '--recount', patchFile.absolutePath]
                ignoreExitValue = true
                errorOutput = err
            }
            throw new GradleException(
                "MultiForge: patch ${group.name}/${patchFile.name} does not apply to ${targetRel}:\n${err}")
        }

        // 3. Record what we produced, so the next run recognises it.
        appliedHashes.parentFile.mkdirs()
        appliedHashes.text = mcTargets.collect {
            "${sha256Of(new File(neoforgeSrcMainJava, it))}  ${it}" + (seededNow.contains(it) ? '  seeded' : '')
        }.join('\n') + '\n'
        logger.lifecycle("MultiForge: ${applied} patch(es) applied (${restored} target(s) reset to pristine, " +
                "${seeded} seeded from :base), ${skipped} committed-tree patch(es) already present.")
    }
}

def sourceFromPatchesTaskName =
        "platformJoined${project.minecraft_version}-${project.neoform_version}SourceFromAppliedPatches"

tasks.named('applyMultiforgePatches').configure {
    dependsOn(sourceFromPatchesTaskName)
}

tasks.named('compileJava').configure {
    dependsOn(applyMultiforgePatches)
}

// Gradle 8.7's static task-input-output validation flags every task
// in this subproject that reads from src/main/{java,resources} as
// consuming an output of the umbrella :setup task without a declared
// edge, failing the scanner CI's build step. (The main fork-build
// hides the same failure via continue-on-error.) The applier already
// wires `sourceFromPatchesTaskName` (an internal NeoGradle task the
// setup umbrella depends on), which is sufficient for correctness —
// but Gradle can't reason about that implicit chain, so declare the
// explicit `:setup` edge on every source-consuming task.
//
// Guarded by findByPath so the dep is only wired when the umbrella
// task actually exists (subprojects that don't participate in setup
// still work).
def sourceConsumers = ['compileJava', 'processResources', 'javadoc', 'sourcesJar']
tasks.matching { task -> sourceConsumers.contains(task.name) }.configureEach {
    if (rootProject.tasks.findByPath(':setup') != null) {
        dependsOn(':setup')
    }
}

// v1.3.2: stage MultiForge patches for NeoGradle's binarypatcher.
//
// Why this exists: binarypatcher (net.minecraftforge:binarypatcher:1.1.1,
// invoked by generateServerBinaryPatches) runs in WHITELIST mode when
// --patches is non-empty: only classes with a corresponding .patch file
// in the patch dir get a binary diff generated. NeoGradle wires
// --patches = upstream/neoforge-1.21.1/patches/ (NeoForge's own patch
// tree). MultiForge's patches under ../../multiforge-patches/**/*.java.patch
// never reach binarypatcher, so classes we seed-from-base and patch
// (WorldBorder, Raids, LevelTicks, ServerFunctionManager, etc.) get
// compiled correctly into the fork jar but no binary diff is generated,
// and the shipped installer's server.lzma ships vanilla classes for
// them. Runtime code that expects the patched methods (e.g.
// WorldBorder.mfTickBody) hits NoSuchMethodError at boot.
//
// This task flattens multiforge-patches/**/*.java.patch into a single
// staging dir whose layout mirrors net/minecraft/... (what binarypatcher
// expects). P.2 wires this staging dir into
// generateServerBinaryPatches.getPatches() alongside NeoForge's own
// patches dir.

def multiforgePatchesStagingDir = layout.buildDirectory.dir('multiforge-patches-staging')

tasks.register('stageMultiforgePatchesForBinaryPatcher', Sync) {
    group = 'multiforge'
    description = 'Flattens multiforge-patches/**/*.java.patch into a single staging dir ' +
            'keyed by target class path — the shape binarypatcher --patches expects.'
    // Sync (not Copy): a plain Copy task never removes stale destination files across
    // runs, so a patch excluded by a later change to the eachFile filter below (e.g. the
    // net/minecraft/-only gate added in v1.3.2 P.2) would linger in the staging dir
    // forever from an earlier build. Sync deletes anything in the destination that this
    // execution didn't (re)produce.

    // Each patch's header carries the target file path; we relocate the
    // .patch file into <staging>/<target-path>.patch so binarypatcher can
    // pick it up. Parse the same "--- a/<path>" first line the applier
    // uses at line ~50 of this file for consistency.

    from(multiforgePatchesRoot) {
        include '**/*.java.patch'
    }
    into(multiforgePatchesStagingDir)
    // Rebuild the destination path from each patch's own --- a/<path> line.
    // eachFile's `relativePath` starts at the multiforge-patches root (so
    // e.g. `08-globals/net/minecraft/world/level/border/WorldBorder.java.patch`);
    // we replace that with the target path from the patch header + `.patch`.
    eachFile { fcd ->
        def targetRel = null
        try {
            def firstLine = fcd.file.withReader('UTF-8') { r -> r.readLine() }
            if (firstLine != null && (firstLine.startsWith('--- a/') || firstLine.startsWith('--- '))) {
                targetRel = firstLine.replaceFirst(/^---\s+a?\//, '').replaceFirst(/^---\s+/, '').trim()
                int tab = targetRel.indexOf('\t')
                if (tab >= 0) targetRel = targetRel.substring(0, tab)
            }
        } catch (Exception e) {
            // Leave targetRel null so we exclude below.
        }
        // binarypatcher diffs against the vanilla "clean" SRG server/client jar, which
        // only ever contains net/minecraft/** classes. A patch targeting NeoForge's own
        // hand-written source (net/neoforged/**, e.g. the 09-events NeoForge.java.patch)
        // or MultiForge's own committed source (net/multiforge/**) has no corresponding
        // class in that clean jar — staging it anyway makes binarypatcher's "Adding new
        // files" step inject the compiled class into the *server jar itself*, duplicating
        // a class that's already legitimately shipped via the universal/neoforge jar and
        // producing a JPMS split-package failure ("Modules neoforge and minecraft export
        // package ... to module ...") at boot. Mirror applyTargetDirFor's net/minecraft/
        // gate above so only genuine vanilla-class patches ever reach the staging dir.
        if (targetRel == null || !targetRel.startsWith('net/minecraft/')) {
            fcd.exclude()
        } else {
            fcd.relativePath = new org.gradle.api.file.RelativePath(true, "${targetRel}.patch".split('/'))
        }
    }
    // Several classes (ServerLevel, Level, Entity, MinecraftServer) are touched by more
    // than one MultiForge patch group in sequence (e.g. 01-ownership then 02-region-tick
    // both patch ServerLevel.java). binarypatcher only uses a patch file's *presence* at
    // the target path as a whitelist marker — the diff itself is generated from the
    // compiled classes, not by applying this file — so which of several patch files for
    // the same target "wins" the copy is immaterial. EXCLUDE (keep-first) avoids a build
    // failure on these legitimate multi-group targets without masking a genuine bug.
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// v1.3.2 P.2: wire the staging dir into all three binary-patch tasks.
// GenerateBinaryPatches.getPatches() is a ConfigurableFileCollection —
// .from() appends without replacing NeoForge's own patches/ dir. Order
// doesn't matter for binarypatcher: it's a "union set of classes to
// diff" whitelist. Adding a dependsOn ensures the staging task runs
// before binarypatcher reads its inputs.
['generateServerBinaryPatches', 'generateClientBinaryPatches', 'generateJoinedBinaryPatches'].each { taskName ->
    tasks.matching { it.name == taskName }.configureEach {
        dependsOn('stageMultiforgePatchesForBinaryPatcher')
        getPatches().from(layout.buildDirectory.dir('multiforge-patches-staging'))
    }
}
