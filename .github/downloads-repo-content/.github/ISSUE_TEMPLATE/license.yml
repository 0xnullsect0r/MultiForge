name: License problem
description: Your MultiForge license token won't activate, was lost, or needs a reissue.
title: "[license] "
labels: ["license", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        **Never paste your license token in this issue.** If you need to prove
        ownership, run `multiforge-license-cli verify --token @path/to/license.key`
        and paste only the `sub` (customer id) and `iat` (issued-at) fields it
        prints.
  - type: dropdown
    id: kind
    attributes:
      label: What kind of license problem?
      options:
        - Token won't activate (server exits with code 78)
        - Lost or need to reissue token
        - Moving license to a new machine
        - Upgrading / changing tier
        - Refund request
        - Other (describe below)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: MultiForge version
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: customer-id
    attributes:
      label: Customer id (sub)
      description: From `multiforge-license-cli verify`. Looks like `cust_...`. Not the token itself.
      placeholder: "cust_abcd1234"
    validations:
      required: false
  - type: input
    id: iat
    attributes:
      label: Token issued-at (iat)
      description: Unix timestamp from `multiforge-license-cli verify`.
      placeholder: "1725450000"
    validations:
      required: false
  - type: input
    id: purchase-email
    attributes:
      label: Email used to purchase
      description: We match against the address the token was sold under.
      placeholder: "you@example.com"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Include the full stderr line that starts with `[MultiForge]` if the server refused to boot.
      placeholder: |
        [MultiForge] Invalid or missing license — refusing to start.
        [MultiForge] Reason: token signature failed verification against key kid=prod-2025.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Sanity checks
      options:
        - label: I am not pasting my license token anywhere in this issue.
          required: true
        - label: I searched existing issues.
          required: true
