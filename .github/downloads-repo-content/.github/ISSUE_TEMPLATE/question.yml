name: Question
description: "\"How do I…?\" — anything the docs didn't answer."
title: "[question] "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing, please check:
        - [Install guide](https://github.com/0xnullsect0r/multiforge-releases/tree/main/docs/install.md)
        - [Operator handbook](https://github.com/0xnullsect0r/multiforge-releases/tree/main/docs/operator-handbook.md)

        Purchase / billing questions go to <https://multiforge.example> — those
        are handled by email, not here.
  - type: textarea
    id: question
    attributes:
      label: What you're trying to do
      description: Skip the "I tried X and got Y" framing — just describe the goal.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: MultiForge version
      placeholder: "1.0.0"
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Sanity checks
      options:
        - label: I checked the install and operator docs first.
          required: true
        - label: I am not pasting my license token in this issue.
          required: true
