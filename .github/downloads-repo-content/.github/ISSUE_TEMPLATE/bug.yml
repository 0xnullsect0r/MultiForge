name: Bug report
description: A crash, incorrect behavior, or a mod that misbehaves under MultiForge.
title: "[bug] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing. **Do not paste your license token anywhere in this issue.**
        If you need to prove ownership, include only the `sub` field printed by
        `multiforge-license-cli verify`.
  - type: input
    id: version
    attributes:
      label: MultiForge version
      description: From the server boot log, e.g. `1.0.0`.
      placeholder: "1.0.0"
    validations:
      required: true
  - type: dropdown
    id: install-path
    attributes:
      label: Install path
      options:
        - Docker (docker-compose)
        - Docker (docker run)
        - Fresh installer JAR
        - Replacement ZIP over existing NeoForge
        - Other (describe below)
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: OS + JVM
      description: Output of `uname -a` and `java -version`.
      placeholder: "Linux 6.5 x86_64 · Temurin 21.0.4"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you see? Include the error message verbatim if there was one.
      placeholder: "Server crashed with NPE at ..."
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start server with mod list attached
        2. Log in
        3. Break a block
        4. Server crashes
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log excerpt
      description: |
        Paste the last ~50 lines of `logs/latest.log` (or the crash log). Use a code block.
        If you can, attach the whole log file too — drag-and-drop into this box.
      render: text
    validations:
      required: true
  - type: input
    id: mods
    attributes:
      label: Mod list summary
      description: How many mods? Any large modpacks (ATM, Vault Hunters, etc.)?
      placeholder: "~180 mods, ATM10 base + KubeJS scripts"
    validations:
      required: false
  - type: textarea
    id: config
    attributes:
      label: Relevant multiforge-server.toml section
      description: If you have non-default `cores`, `threads-per-core`, `regions`, or `persistence` values.
      render: toml
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Sanity checks
      options:
        - label: I searched existing issues.
          required: true
        - label: I am not pasting my license token anywhere in this issue.
          required: true
