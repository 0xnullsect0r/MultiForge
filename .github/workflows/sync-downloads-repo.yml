name: sync-downloads-repo

# Mirrors public-facing content (README, docs/, issue templates,
# SECURITY.md) into the public multiforge-releases repo whenever
# main advances. Release binaries are attached separately by the
# `release` workflow — this one only touches the tracked files.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/downloads-repo-content/**"
      - ".github/workflows/sync-downloads-repo.yml"
  workflow_dispatch:

concurrency:
  group: sync-downloads-repo
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    name: push README + docs + issue templates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RELEASES_REPO: ${{ vars.RELEASES_REPO || '0xnullsect0r/multiforge-releases' }}
    steps:
      - name: Checkout source repo
        uses: actions/checkout@v4
        with:
          path: source

      - name: Clone downloads repo
        env:
          # Fine-grained PAT with Contents: Read+Write on the downloads repo.
          # Same secret the release workflow uses.
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "$GH_TOKEN" ] || {
              echo "::error::RELEASES_REPO_TOKEN secret is not set on this repo. See docs/downloads-repo-setup.md."
              exit 1
          }
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${RELEASES_REPO}.git" downloads

      - name: Stage content
        run: |
          set -euo pipefail
          cd downloads

          # Wipe the tracked mirror directories so a delete in the
          # source repo propagates. Preserve `.git/` and anything
          # under `.github/workflows/` that the downloads repo may
          # own directly.
          rm -rf docs README.md SECURITY.md .github/ISSUE_TEMPLATE

          # Copy README + SECURITY + issue templates from the content bundle.
          mkdir -p .github
          cp ../source/.github/downloads-repo-content/README.md .
          cp ../source/.github/downloads-repo-content/SECURITY.md .
          cp -r ../source/.github/downloads-repo-content/.github/ISSUE_TEMPLATE .github/

          # Copy the operator-facing docs. Internal notes (like
          # blueprint.md and website-install-copy.md) stay in the
          # private repo.
          mkdir -p docs
          # Internal-only files (blueprint.md, website-install-copy.md,
          # downloads-repo-setup.md, docs/README.md) intentionally stay
          # in the private repo — the public top-level README indexes
          # the docs directly.
          for f in \
              install.md \
              operator-handbook.md \
              persistence.md \
              regions.md \
              chunks.md \
              migration.md \
              global-network.md \
              license.md \
              api.md ; do
              if [ -f "../source/docs/$f" ]; then
                  cp "../source/docs/$f" "docs/$f"
              fi
          done

      - name: Commit + push if changed
        working-directory: downloads
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config user.name "multiforge-sync[bot]"
          git config user.email "sync@multiforge.example"
          git add -A
          if git diff --cached --quiet ; then
              echo "no content changes; skipping push"
              exit 0
          fi
          git commit -m "docs: sync from source repo @ ${COMMIT_SHA::10}"
          git push origin HEAD:main
