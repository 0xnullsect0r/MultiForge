name: scanner

# Gate for the mod-safety scanner (multiforge-scanner/, docs/design/scanner-rules.md).
#
# The scanner audits *mod* jars, so it is checked against a corpus of mod
# jars with known answers: the multiforge-testmods fixture mods and the
# client debug mod. :multiforge-scanner:scanCorpus scans them with every
# active rule and compares the findings with multiforge-scanner/corpus/
# expected.txt; any added, dropped or moved finding fails the check until the
# expectation is updated on purpose (-PupdateCorpus).
#
# This replaced an advisory scan of the fork jar, which could never gate:
# the fork embeds all of patched Vanilla (8,000+ net/minecraft classes), so
# nearly every finding was against Vanilla code, not MultiForge's.

on:
  pull_request:
    branches: [main, develop]
    paths:
      - "multiforge-scanner/**"
      - "multiforge-testmods/**"
      - "multiforge-client/**"
      - "gradle.properties"
      - ".github/workflows/scanner.yml"
  push:
    branches: [main, develop]
    paths:
      - "multiforge-scanner/**"
      - "multiforge-testmods/**"
      - "multiforge-client/**"
      - "gradle.properties"
      - ".github/workflows/scanner.yml"

concurrency:
  group: scanner-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  corpus:
    name: scanner corpus (fixture + client mod jars)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      # The corpus mods build against NeoForge (net.neoforged.moddev).
      - name: Scan the corpus
        env:
          GRADLE_OPTS: -Xmx6G
        run: ./gradlew :multiforge-scanner:scanCorpus --no-daemon --stacktrace

      - name: SARIF for the corpus
        if: always()
        run: |
          set -uo pipefail
          SCANNER_JAR="$(ls -t multiforge-scanner/build/libs/multiforge-scanner-*.jar 2>/dev/null | grep -v -- -sources | head -n1 || true)"
          [ -n "$SCANNER_JAR" ] || ./gradlew :multiforge-scanner:jar --no-daemon -q
          SCANNER_JAR="$(ls -t multiforge-scanner/build/libs/multiforge-scanner-*.jar | grep -v -- -sources | head -n1)"
          java -jar "$SCANNER_JAR" --sarif \
            multiforge-testmods/writer/build/libs/*.jar \
            multiforge-testmods/legacy/build/libs/*.jar \
            > scanner-corpus.sarif || true

      - name: Upload SARIF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scanner-corpus-sarif-${{ github.sha }}
          path: scanner-corpus.sarif
          retention-days: 30
