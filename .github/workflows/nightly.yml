name: nightly

# Runs the live-server checks that are too slow for every PR, against a server
# installed from this commit's own installer:
#
#   determinism  the vanilla-parity gate: one seed world ticked on stock
#                NeoForge and on MultiForge (1 and 4 workers), terrain equal
#   scenario     Phase X checks x1-x4 on stock vs MultiForge
#   swarm        12 protocol bots spread 2000 blocks apart for 5 minutes in
#                strict mode (x8StrictSwarm preset, shortened): regions tick
#                on workers, no ownership violation, no overrun
#   stress       entity-limbo and slow-tick stress with the fixture mods
#   updater      scripts/test-multiforge-update.sh against this installer
#
# The full-size runs (100/500 bots, 60 minutes, ATM10) need more than a
# hosted runner has; see docs/verification/README.md for their runbooks.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    name: live-server checks
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-home-cache-includes: |
            caches
            notifications
            wrapper

      - name: Set heap
        run: echo "GRADLE_OPTS=-Xmx6G" >> "$GITHUB_ENV"

      - name: Publish multiforge-runtime + api to mavenLocal
        run: ./gradlew :multiforge-api:publishToMavenLocal :multiforge-runtime:publishToMavenLocal --no-daemon

      - name: Build the MultiForge installer
        working-directory: upstream/neoforge-1.21.1
        run: |
          ./gradlew --no-configuration-cache --stacktrace setup
          ./gradlew --no-configuration-cache --stacktrace :neoforge:installerJar

      - name: Vanilla-parity gate
        run: ./gradlew :multiforge-bench:determinism -Pworkers=1,4 --no-daemon --stacktrace

      - name: Phase X scenarios
        if: always()
        run: ./gradlew :multiforge-bench:scenario --no-daemon --stacktrace

      - name: Strict-mode swarm (12 bots spread over 2000 blocks, 5 minutes)
        if: always()
        # Spread out so the bots fall into separate regions that tick on workers;
        # the run fails if no region ever ticked on one. ZGC: a full G1 pause
        # stops every region at once and reads as an overrun.
        run: |
          ./gradlew :multiforge-bench:x8StrictSwarm -Pplayers=12 -Pspread=2000 -Pticks=6000 \
            "-PextraJvmArgs=-Xmx8G -XX:+UseZGC" \
            -PoutputFile="$PWD/nightly-results/swarm-12-spread2000.json" --no-daemon --stacktrace

      - name: Stress checks (entity limbo, slow ticks)
        if: always()
        run: ./gradlew :multiforge-bench:stress -PlimboSeconds=120 --no-daemon --stacktrace

      - name: Updater install, update and rollback
        if: always()
        # Before: the latest published release. After: this commit's installer,
        # scanner and the pinned server starter, with SHA256SUMS like a release.
        run: |
          set -euo pipefail
          mkdir -p updater/assets
          curl -fsSL -o updater/old-installer.jar \
            "https://github.com/${{ github.repository }}/releases/latest/download/multiforge-installer.jar"
          cp "$(find upstream/neoforge-1.21.1/projects/neoforge/build/libs -maxdepth 1 -name 'neoforge-*-installer.jar' | head -1)" \
            updater/assets/multiforge-installer.jar
          ./gradlew :multiforge-scanner:jar --no-daemon -q
          cp "$(find multiforge-scanner/build/libs -maxdepth 1 -name 'multiforge-scanner-*.jar' ! -name '*-sources.jar' | head -1)" \
            updater/assets/multiforge-scanner.jar
          curl -fsSL -o updater/assets/server.jar \
            https://github.com/NeoForged/serverstarterjar/releases/download/0.1.35/server.jar
          echo "d019d815868d451e57bdb965174b8443ec361336e84e9c41abc41a6c627bacd1  updater/assets/server.jar" | sha256sum -c -
          (cd updater/assets && sha256sum -- * > SHA256SUMS)
          scripts/test-multiforge-update.sh updater/old-installer.jar updater/assets updater/work

      - name: Upload results and server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-${{ github.sha }}
          path: |
            nightly-results/
            multiforge-bench/build/bench-logs/
          retention-days: 14
