name: nightly

# Runs the live-server checks that are too slow for every PR, against a server
# installed from this commit's own installer:
#
#   determinism  the vanilla-parity gate: one seed world ticked on stock
#                NeoForge and on MultiForge (1 and 4 workers), terrain equal
#   scenario     Phase X checks x1-x4 on stock vs MultiForge
#   swarm        20 protocol bots for 5 minutes in strict mode (x8StrictSwarm
#                preset, shortened): no ownership violation, no overrun
#
# The full-size runs (100/500 bots, 60 minutes, ATM10) need more than a
# hosted runner has; see docs/verification/README.md for their runbooks.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    name: live-server checks
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-home-cache-includes: |
            caches
            notifications
            wrapper

      - name: Set heap
        run: echo "GRADLE_OPTS=-Xmx6G" >> "$GITHUB_ENV"

      - name: Publish multiforge-runtime + api to mavenLocal
        run: ./gradlew :multiforge-api:publishToMavenLocal :multiforge-runtime:publishToMavenLocal --no-daemon

      - name: Build the MultiForge installer
        working-directory: upstream/neoforge-1.21.1
        run: |
          ./gradlew --no-configuration-cache --stacktrace setup
          ./gradlew --no-configuration-cache --stacktrace :neoforge:installerJar

      - name: Vanilla-parity gate
        run: ./gradlew :multiforge-bench:determinism -Pworkers=1,4 --no-daemon --stacktrace

      - name: Phase X scenarios
        if: always()
        run: ./gradlew :multiforge-bench:scenario --no-daemon --stacktrace

      - name: Strict-mode swarm (20 bots, 5 minutes)
        if: always()
        run: |
          ./gradlew :multiforge-bench:x8StrictSwarm -Pplayers=20 -Pticks=6000 \
            -PoutputFile="$PWD/nightly-results/swarm-20.json" --no-daemon --stacktrace

      - name: Upload results and server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-${{ github.sha }}
          path: |
            nightly-results/
            multiforge-bench/build/bench-logs/
          retention-days: 14
