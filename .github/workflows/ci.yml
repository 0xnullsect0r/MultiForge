name: ci

on:
  push:
    branches: [main, develop, release/1.21.x, port/26.1.2]
  pull_request:
    branches: [main, develop, release/1.21.x, port/26.1.2]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build + test (pure-Java modules)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Resolve the release line
        run: .github/scripts/mf-line.sh --tree >> "$GITHUB_ENV"

      - name: Set up JDK ${{ env.MF_JAVA }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.MF_JAVA }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Spotless check
        run: ./gradlew spotlessCheck --no-daemon --stacktrace

      - name: Updater Minecraft version guard
        run: sh scripts/test-multiforge-update-guard.sh

      - name: Release line rules
        run: sh scripts/test-mf-line.sh

      - name: Build + test
        # Enumerate the CI-scoped modules explicitly. `./gradlew build`
        # at the root also pulls in :multiforge-client, whose moddev
        # plugin has to materialise a full NeoForm-decompiled Minecraft
        # tree before it can compile a single file — minutes of work
        # that most PRs do not need. The client module therefore has its
        # own job below (`client-build`), gated on paths that can
        # actually break it.
        run: |
          ./gradlew \
            :multiforge-api:build \
            :multiforge-runtime:build \
            :multiforge-scanner:build \
            :multiforge-installer:build \
            :multiforge-bench:build \
            --no-daemon --stacktrace

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ github.sha }}
          path: |
            **/build/reports/tests/
            **/build/reports/spotless/
            **/build/test-results/
          retention-days: 7

  client-build:
    name: client mod, fixture mods and scanner corpus
    runs-on: ubuntu-latest
    # moddev's NeoForm decompile dominates; the compile + test itself is
    # seconds. Only runs when something that can break the client mod
    # changed — see the `paths` filter on the dorny/paths-filter step.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            client:
              - 'multiforge-client/**'
              - 'multiforge-testmods/**'
              - 'multiforge-scanner/**'
              - 'multiforge-api/src/main/**'
              - 'multiforge-runtime/src/main/java/net/multiforge/runtime/diagnostics/**'
              - 'upstream/neoforge-*/src/main/java/net/multiforge/neoforge/debug/**'
              - 'gradle.properties'
              - '.github/workflows/ci.yml'

      - name: Resolve the release line
        run: .github/scripts/mf-line.sh --tree >> "$GITHUB_ENV"

      - name: Does this tree carry the MultiForge patches?
        # false only while a new line is being bootstrapped from stock NeoForge.
        run: echo "MF_PATCHES=$(sed -n 's/^multiforge_patches_enabled=//p' "$MF_TREE/gradle.properties" | grep . || echo true)" >> "$GITHUB_ENV"

      - name: Does this line build the client mod?
        # A line may leave the client out until it is ported; the 1.x line never can.
        run: .github/scripts/mf-client.sh >> "$GITHUB_ENV"

      - name: Set up JDK ${{ env.MF_JAVA }}
        if: steps.changes.outputs.client == 'true' && env.MF_PATCHES != 'false'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.MF_JAVA }}

      - name: Set up Gradle
        if: steps.changes.outputs.client == 'true' && env.MF_PATCHES != 'false'
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Build + test client mod
        if: steps.changes.outputs.client == 'true' && env.MF_PATCHES != 'false'
        # 6G matches release.yml — moddev's NeoForm decompile is the
        # largest step and OOMs at the default heap.
        env:
          GRADLE_OPTS: -Xmx6G
        # The fixture mods share the client's moddev setup, so they build here, and
        # the scanner corpus (every finding on them and on the client jar) is
        # checked against multiforge-scanner/corpus/expected.txt.
        run: |
          CLIENT=:multiforge-client:build
          if [ "$MF_CLIENT_PORTED" != true ]; then
            echo "::warning::multiforge-client is not ported to the $MF_LINE line: not built, and left out of the scanner corpus"
            CLIENT=
          fi
          ./gradlew $CLIENT \
            :multiforge-testmods:writer:build :multiforge-testmods:legacy:build \
            :multiforge-testmods:slowtick:build :multiforge-testmods:limbo:build \
            :multiforge-scanner:scanCorpus --no-daemon --stacktrace

      - name: Upload test reports on failure
        if: failure() && steps.changes.outputs.client == 'true' && env.MF_PATCHES != 'false'
        uses: actions/upload-artifact@v7
        with:
          name: client-test-reports-${{ github.sha }}
          path: |
            multiforge-client/build/reports/tests/
            multiforge-client/build/test-results/
          retention-days: 7

  fork-build:
    # A required status check matches this name exactly, so the 1.21.1 line's
    # must not change. (`env` is not available in a job name.)
    name: fork build + GameTests (upstream/neoforge-${{ (github.ref_name == 'port/26.1.2' || github.base_ref == 'port/26.1.2') && '26.1.2' || '1.21.1' }})
    runs-on: ubuntu-latest
    # setup (NeoForm decompile) ~3-6 min cold, compile ~4 min, GameTest server
    # ~2 min. The Gradle user home (NeoForm artifacts, dependencies) is cached
    # by setup-gradle, so a warm run skips most of the decompile.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Resolve the release line
        run: .github/scripts/mf-line.sh --tree >> "$GITHUB_ENV"

      - name: Does this tree carry the MultiForge patches?
        # false only while a new line is being bootstrapped from stock NeoForge.
        run: echo "MF_PATCHES=$(sed -n 's/^multiforge_patches_enabled=//p' "$MF_TREE/gradle.properties" | grep . || echo true)" >> "$GITHUB_ENV"

      - name: Set up JDK ${{ env.MF_JAVA }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.MF_JAVA }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          # The fork's NeoGradle workspace lives in the Gradle user home too.
          gradle-home-cache-includes: |
            caches
            notifications
            wrapper

      # Bigger heap for the fork build — NeoForge's setup + platform plugin
      # OOM with the default.
      - name: Set fork-build heap
        run: echo "GRADLE_OPTS=-Xmx6G" >> "$GITHUB_ENV"

      - name: Publish multiforge-runtime + api to mavenLocal
        # The fork depends on these via mavenLocal; this also catches runtime
        # API drift that would break the fork while the pure-Java job is green.
        run: |
          ./gradlew \
            :multiforge-api:publishToMavenLocal \
            :multiforge-runtime:publishToMavenLocal \
            --no-daemon --stacktrace

      - name: NeoForge setup (decompile + NeoForge patches)
        working-directory: ${{ env.MF_TREE }}
        run: ./gradlew --no-configuration-cache --stacktrace setup

      - name: Apply MultiForge patches + compile the fork
        # compileJava runs :neoforge:applyMultiforgePatches, which resets every
        # patched file to its pristine copy and applies all groups in order.
        # It runs after `setup` (a separate invocation above). On a tree still
        # being bootstrapped (MF_PATCHES=false) this compiles stock NeoForge.
        working-directory: ${{ env.MF_TREE }}
        run: ./gradlew --no-configuration-cache --stacktrace :neoforge:compileJava immaculateCheck licenseCheck

      - name: Mixin-target parity (patched classes keep every Vanilla method and lambda)
        # Also on a partly ported tree: every ported group must keep the rule.
        if: env.MF_PATCHES != 'false'
        working-directory: ${{ env.MF_TREE }}
        run: ./gradlew --no-configuration-cache --stacktrace :neoforge:checkMixinTargets

      - name: Required GameTest floor for this tree
        # Each tree records its own count; a tree without one is the 1.21.x line.
        if: env.MF_PATCHES != 'false'
        run: echo "MIN_REQUIRED_GAMETESTS=$(sed -n 's/^multiforge_min_required_gametests=//p' "$MF_TREE/gradle.properties" | grep . || echo 205)" >> "$GITHUB_ENV"

      - name: GameTest server (NeoForge suite + MultiForge tests, regions on workers)
        if: env.MF_PATCHES != 'false'
        timeout-minutes: 15
        # Boots the patched dedicated server with the regionized runtime (every
        # region on a worker; tests/build.gradle) and runs every required GameTest.
        # A failure exits non-zero. The log is also checked for the number of
        # required tests that passed, so a run in which tests silently stopped
        # registering (or none ran) cannot pass.
        working-directory: ${{ env.MF_TREE }}
        run: |
          set -o pipefail
          ./gradlew --no-configuration-cache --stacktrace :tests:runGameTestServer 2>&1 | tee gametest.log
          ../../.github/scripts/check-gametest-log.sh gametest.log "$MIN_REQUIRED_GAMETESTS"

      - name: GameTest server in strict mode
        if: env.MF_PATCHES != 'false'
        timeout-minutes: 15
        # The same suite with ownership violations and region overruns thrown
        # instead of rerouted and logged.
        working-directory: ${{ env.MF_TREE }}
        run: |
          set -o pipefail
          ./gradlew --no-configuration-cache --stacktrace :tests:runGameTestServer -PmultiforgeMode=strict 2>&1 | tee gametest-strict.log
          ../../.github/scripts/check-gametest-log.sh gametest-strict.log "$MIN_REQUIRED_GAMETESTS"

      - name: Upload fork reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fork-build-reports-${{ github.sha }}
          path: |
            ${{ env.MF_TREE }}/**/build/reports/
            ${{ env.MF_TREE }}/tests/runs/gameTestServer/logs/
            ${{ env.MF_TREE }}/tests/runs/gameTestServer/crash-reports/
          retention-days: 7
  gitleaks:
    name: secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # We invoke the gitleaks binary directly rather than via
      # gitleaks/gitleaks-action so a fresh repo's first push (no parent
      # commit to diff against) still scans cleanly. `detect` walks the
      # full working tree.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.24.3"
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan working tree
        run: gitleaks detect --redact --no-git --source . --verbose
