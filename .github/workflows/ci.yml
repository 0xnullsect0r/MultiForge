name: ci

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build + test (pure-Java modules)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Spotless check
        run: ./gradlew spotlessCheck --no-daemon --stacktrace

      - name: Build + test
        # Enumerate the CI-scoped modules explicitly. `./gradlew build`
        # at the root also pulls in :multiforge-client, whose moddev
        # plugin has to materialise a full NeoForm-decompiled Minecraft
        # tree before it can compile a single file — minutes of work
        # that most PRs do not need. The client module therefore has its
        # own job below (`client-build`), gated on paths that can
        # actually break it.
        run: |
          ./gradlew \
            :multiforge-api:build \
            :multiforge-runtime:build \
            :multiforge-scanner:build \
            :multiforge-installer:build \
            :multiforge-bench:build \
            --no-daemon --stacktrace

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.sha }}
          path: |
            **/build/reports/tests/
            **/build/reports/spotless/
            **/build/test-results/
          retention-days: 7

  client-build:
    name: client mod build + test (multiforge-client)
    runs-on: ubuntu-latest
    # moddev's NeoForm decompile dominates; the compile + test itself is
    # seconds. Only runs when something that can break the client mod
    # changed — see the `paths` filter on the dorny/paths-filter step.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            client:
              - 'multiforge-client/**'
              - 'multiforge-api/src/main/**'
              - 'multiforge-runtime/src/main/java/net/multiforge/runtime/diagnostics/**'
              - 'upstream/neoforge-1.21.1/src/main/java/net/multiforge/neoforge/debug/**'
              - 'gradle.properties'
              - '.github/workflows/ci.yml'

      - name: Set up JDK 21
        if: steps.changes.outputs.client == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        if: steps.changes.outputs.client == 'true'
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Build + test client mod
        if: steps.changes.outputs.client == 'true'
        # 6G matches release.yml — moddev's NeoForm decompile is the
        # largest step and OOMs at the default heap.
        env:
          GRADLE_OPTS: -Xmx6G
        run: ./gradlew :multiforge-client:build --no-daemon --stacktrace

      - name: Upload test reports on failure
        if: failure() && steps.changes.outputs.client == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: client-test-reports-${{ github.sha }}
          path: |
            multiforge-client/build/reports/tests/
            multiforge-client/build/test-results/
          retention-days: 7

  fork-build:
    name: fork build + GameTests (upstream/neoforge-1.21.1)
    runs-on: ubuntu-latest
    # setup (NeoForm decompile) ~3-6 min cold, compile ~4 min, GameTest server
    # ~2 min. The Gradle user home (NeoForm artifacts, dependencies) is cached
    # by setup-gradle, so a warm run skips most of the decompile.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          # The fork's NeoGradle workspace lives in the Gradle user home too.
          gradle-home-cache-includes: |
            caches
            notifications
            wrapper

      # Bigger heap for the fork build — NeoForge's setup + platform plugin
      # OOM with the default.
      - name: Set fork-build heap
        run: echo "GRADLE_OPTS=-Xmx6G" >> "$GITHUB_ENV"

      - name: Publish multiforge-runtime + api to mavenLocal
        # The fork depends on these via mavenLocal; this also catches runtime
        # API drift that would break the fork while the pure-Java job is green.
        run: |
          ./gradlew \
            :multiforge-api:publishToMavenLocal \
            :multiforge-runtime:publishToMavenLocal \
            --no-daemon --stacktrace

      - name: NeoForge setup (decompile + NeoForge patches)
        working-directory: upstream/neoforge-1.21.1
        run: ./gradlew --no-configuration-cache --stacktrace setup

      - name: Apply MultiForge patches + compile the fork
        # compileJava runs :neoforge:applyMultiforgePatches, which resets every
        # patched file to its pristine copy and applies all groups in order.
        # It runs after `setup` (a separate invocation above).
        working-directory: upstream/neoforge-1.21.1
        run: ./gradlew --no-configuration-cache --stacktrace :neoforge:compileJava immaculateCheck licenseCheck

      - name: GameTest server (NeoForge suite + MultiForge region-tick tests)
        # Boots the patched dedicated server with the regionized runtime and
        # runs every required GameTest; any failure fails the job.
        working-directory: upstream/neoforge-1.21.1
        run: ./gradlew --no-configuration-cache --stacktrace :tests:runGameTestServer

      - name: Upload fork reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fork-build-reports-${{ github.sha }}
          path: |
            upstream/neoforge-1.21.1/**/build/reports/
            upstream/neoforge-1.21.1/tests/runs/gameTestServer/logs/
            upstream/neoforge-1.21.1/tests/runs/gameTestServer/crash-reports/
          retention-days: 7
  gitleaks:
    name: secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # We invoke the gitleaks binary directly rather than via
      # gitleaks/gitleaks-action so a fresh repo's first push (no parent
      # commit to diff against) still scans cleanly. `detect` walks the
      # full working tree.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.24.3"
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan working tree
        run: gitleaks detect --redact --no-git --source . --verbose
