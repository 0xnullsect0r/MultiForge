name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/multiforge-server

jobs:
  build-jars:
    name: build release jars
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build release artifacts (pure-Java modules)
        run: |
          ./gradlew \
            :multiforge-api:build \
            :multiforge-runtime:build \
            :multiforge-scanner:build \
            :multiforge-installer:build \
            :multiforge-bench:build \
            --no-daemon --stacktrace

      - name: Assemble release bundle
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#v}"
          RELEASE_DIR="release"
          mkdir -p "$RELEASE_DIR"

          # Runtime library — mod authors compile against this.
          cp multiforge-runtime/build/libs/multiforge-runtime-*.jar "$RELEASE_DIR/" \
              2>/dev/null || cp multiforge-runtime/build/libs/*.jar "$RELEASE_DIR/"

          # Fresh-install jar.
          INSTALLER_JAR=$(find multiforge-installer/build/libs -maxdepth 1 -type f \
              -name 'multiforge-installer-*.jar' ! -name '*-sources.jar' | head -1)
          if [ -n "$INSTALLER_JAR" ]; then
              cp "$INSTALLER_JAR" "$RELEASE_DIR/"
              cp "$INSTALLER_JAR" "$RELEASE_DIR/multiforge-installer.jar"
          fi

          # Replacement zip — overlay onto an existing NeoForge server.
          if [ -n "$INSTALLER_JAR" ]; then
              java -jar "$INSTALLER_JAR" build-zip \
                  --out "$RELEASE_DIR/multiforge-${VER}-replacement.zip"
          fi

          ls -l "$RELEASE_DIR/"

      - name: Upload jars artifact
        uses: actions/upload-artifact@v4
        with:
          name: jars-${{ github.ref_name }}
          path: release/
          retention-days: 30

  build-image:
    name: build + push multi-arch image
    runs-on: ubuntu-latest
    needs: build-jars
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build + push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  gh-release:
    name: create GitHub release
    runs-on: ubuntu-latest
    needs: [build-jars, build-image]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Download release bundle
        uses: actions/download-artifact@v4
        with:
          name: jars-${{ github.ref_name }}
          path: release/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: release/*
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          body: |
            MultiForge ${{ github.ref_name }} — GPL-3.0-only.

            Downloads:
            - Fresh installer JAR: `multiforge-installer-*.jar`
              (stable alias: [multiforge-installer.jar](https://github.com/${{ github.repository }}/releases/latest/download/multiforge-installer.jar))
            - Drop-in replacement ZIP: `multiforge-*-replacement.zip`
            - Docker image: `docker pull ghcr.io/${{ github.repository_owner }}/multiforge-server:${{ github.ref_name }}`
            - Runtime library (for mod authors): `multiforge-runtime-*.jar`

            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for what changed.
