name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-jars:
    name: build release jars
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build release artifacts (pure-Java modules + client mod)
        # v1.3.5: :multiforge-client compiles through moddev (NeoForm-produced
        # vanilla + NeoForge merged) so the client debug mod ships as a
        # real distributable jar. Heap bumped to 6G to match scanner.yml's
        # fork-build (moddev's NeoForm decompile is the largest step).
        env:
          GRADLE_OPTS: -Xmx6G
        run: |
          ./gradlew \
            :multiforge-api:build \
            :multiforge-runtime:build \
            :multiforge-scanner:build \
            :multiforge-installer:build \
            :multiforge-bench:build \
            :multiforge-client:build \
            --no-daemon --stacktrace

      - name: Assemble release bundle
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#v}"
          RELEASE_DIR="release"
          mkdir -p "$RELEASE_DIR"

          # Runtime library — mod authors compile against this.
          cp multiforge-runtime/build/libs/multiforge-runtime-*.jar "$RELEASE_DIR/" \
              2>/dev/null || cp multiforge-runtime/build/libs/*.jar "$RELEASE_DIR/"

          # v1.3.5: client debug mod. Ships both a versioned filename and
          # a stable-alias multiforge-client.jar so docs can link
          # `.../releases/latest/download/multiforge-client.jar` without
          # a version bump every release.
          CLIENT_JAR=$(find multiforge-client/build/libs -maxdepth 1 -type f \
              -name 'multiforge-client-*.jar' ! -name '*-sources.jar' | head -1)
          if [ -n "$CLIENT_JAR" ]; then
              cp "$CLIENT_JAR" "$RELEASE_DIR/"
              cp "$CLIENT_JAR" "$RELEASE_DIR/multiforge-client.jar"
          else
              echo "::warning::multiforge-client jar not found under multiforge-client/build/libs — client debug mod will not ship in this release."
          fi

          # Mod-safety scanner, run by /multiforge certify from the server
          # directory. The updater installs it next to server.jar.
          SCANNER_JAR=$(find multiforge-scanner/build/libs -maxdepth 1 -type f \
              -name 'multiforge-scanner-*.jar' ! -name '*-sources.jar' | head -1)
          if [ -z "$SCANNER_JAR" ]; then
              echo "::error::multiforge-scanner jar not found under multiforge-scanner/build/libs"
              exit 1
          fi
          cp "$SCANNER_JAR" "$RELEASE_DIR/multiforge-scanner-${VER}.jar"
          cp "$SCANNER_JAR" "$RELEASE_DIR/multiforge-scanner.jar"

          # One-line updater: curl -fsSL .../latest/download/multiforge-update.sh | sh
          cp scripts/multiforge-update.sh "$RELEASE_DIR/multiforge-update.sh"

          # server.jar: NeoForged's server starter (LGPL-2.1,
          # https://github.com/NeoForged/serverstarterjar), which launches
          # whatever run.sh names, so `java -jar server.jar nogui` always
          # starts the installed version. Mirrored at a pinned version and
          # checksum so a release never ships a starter we did not test.
          SERVER_STARTER_VERSION=0.1.35
          SERVER_STARTER_SHA256=d019d815868d451e57bdb965174b8443ec361336e84e9c41abc41a6c627bacd1
          curl -fsSL -o "$RELEASE_DIR/server.jar" \
              "https://github.com/NeoForged/serverstarterjar/releases/download/${SERVER_STARTER_VERSION}/server.jar"
          echo "${SERVER_STARTER_SHA256}  $RELEASE_DIR/server.jar" | sha256sum -c -

          # The drop-in replacement ZIP is NOT built here. It embeds the
          # fork installer, which only exists after the
          # build-fork-installer job runs — so the ZIP is assembled there
          # instead. See that job's "Assemble drop-in replacement ZIP"
          # step.

          # Pelican Panel / Pterodactyl egg (v1.3.2 E.3). Kept at repo
          # root but attached to every release so panel users can grab
          # it from the release download page.
          cp pelican-egg.json "$RELEASE_DIR/pelican-egg.json"

          ls -l "$RELEASE_DIR/"

      - name: Upload jars artifact
        uses: actions/upload-artifact@v4
        with:
          name: jars-${{ github.ref_name }}
          path: release/
          retention-days: 30

  build-fork-installer:
    name: build fork installer (MultiForge-patched NeoForge)
    runs-on: ubuntu-latest
    # 40 minutes: :setup ~5 min, apply patches ~5s, fork installer build ~10 min,
    # + Gradle warm-up + cache miss slack. Longer than ci.yml's fork-compile
    # (30min) because we also generate binary patches and build the installer jar.
    timeout-minutes: 40
    # Required: the patched server installer is the product. A release without
    # it is not published (gh-release needs this job to succeed).
    needs: build-jars
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Set fork-build heap
        run: echo "GRADLE_OPTS=-Xmx6G" >> "$GITHUB_ENV"

      - name: Publish multiforge-api + runtime to mavenLocal
        run: |
          ./gradlew \
            :multiforge-api:publishToMavenLocal \
            :multiforge-runtime:publishToMavenLocal \
            --no-daemon --stacktrace

      - name: Setup + build fork installer
        working-directory: upstream/neoforge-1.21.1
        # applyMultiforgePatches (run by compileJava) is idempotent: it resets
        # every patched file to its pristine copy before applying, so it is
        # safe whether or not setup just regenerated the sources.
        run: |
          ./gradlew --no-configuration-cache --no-daemon --stacktrace setup
          ./gradlew --no-configuration-cache --no-daemon --stacktrace :neoforge:installerJar

      - name: Assert the fork reports a real NeoForge version
        working-directory: upstream/neoforge-1.21.1
        # v1.5.0 shipped reporting `1.21.1-v1.5.0.0-beta`, which is not a
        # NeoForge version: Maven compares its leading `1` against the `21`
        # in a range like [21.1.152,) and puts it below every floor, so a
        # MultiForge server refused to load ANY mod. Fail the release here
        # rather than ship that again.
        run: |
          set -euo pipefail
          VER=$(./gradlew -q --no-daemon :neoforge:properties \
              | awk '/^NeoForge version /{print $3; exit}')
          echo "fork reports: $VER"
          if ! printf '%s' "$VER" | grep -qE '^21\.[0-9]+\.[0-9]+-multiforge-'; then
              echo "::error::Fork version '$VER' is not <neoforge base>-multiforge-<ver>." \
                   "Mods resolve their neoforge dependency range against this string;" \
                   "anything else refuses every mod. See docs/compatibility.md."
              exit 1
          fi

      - name: Stage fork installer with release-friendly name
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#v}"
          mkdir -p release
          # Fork installer output path (NeoDev's installerJar task):
          # projects/neoforge/build/libs/neoforge-<version>-installer.jar
          FORK_JAR=$(find upstream/neoforge-1.21.1/projects/neoforge/build/libs \
              -maxdepth 1 -name 'neoforge-*-installer.jar' 2>/dev/null | head -1)
          if [ -z "$FORK_JAR" ]; then
              echo "::error::No fork installer jar found under upstream/neoforge-1.21.1/projects/neoforge/build/libs"
              exit 1
          fi
          cp "$FORK_JAR" "release/multiforge-${VER}-installer.jar"
          # Stable alias — the URL the README + docs point at.
          # multiforge-installer.jar now == the fork installer (v1.3.3+).
          cp "$FORK_JAR" "release/multiforge-installer.jar"
          ls -l release/

      - name: Assemble drop-in replacement ZIP
        shell: bash
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#v}"
          # The ZIP embeds the fork installer and a converter script that
          # runs it in place against an existing NeoForge server dir. It
          # cannot ship a finished server: that tree is ~180 MB and
          # contains Mojang's server jar plus the patched derivatives,
          # none of which may be redistributed. Hence the installer.
          ./gradlew :multiforge-installer:jar --no-daemon --stacktrace
          BUILDER=$(find multiforge-installer/build/libs -maxdepth 1 -type f \
              -name 'multiforge-installer-*.jar' ! -name '*-sources.jar' | head -1)
          if [ -z "$BUILDER" ]; then
              echo "::error::replacement-archive builder jar not found"
              exit 1
          fi
          java -jar "$BUILDER" build-zip \
              --out "release/multiforge-${VER}-replacement.zip" \
              --installer "release/multiforge-installer.jar"
          # Stable alias so docs can link
          # .../releases/latest/download/multiforge-replacement.zip
          cp "release/multiforge-${VER}-replacement.zip" \
              "release/multiforge-replacement.zip"
          ls -l release/

      - name: Upload fork installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: fork-installer-${{ github.ref_name }}
          path: |
            release/multiforge-*-installer.jar
            release/multiforge-installer.jar
            release/multiforge-*-replacement.zip
            release/multiforge-replacement.zip
          retention-days: 30

      - name: Upload fork test/build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fork-installer-reports-${{ github.sha }}
          path: |
            upstream/neoforge-1.21.1/**/build/reports/
            upstream/neoforge-1.21.1/**/build/patch-rejects/
          retention-days: 7

  gh-release:
    name: create GitHub release
    runs-on: ubuntu-latest
    needs: [build-jars, build-fork-installer]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Download release bundle
        uses: actions/download-artifact@v4
        with:
          name: jars-${{ github.ref_name }}
          path: release/

      - name: Download fork installer
        uses: actions/download-artifact@v4
        with:
          name: fork-installer-${{ github.ref_name }}
          path: release/

      - name: Checksums
        # The updater verifies every asset it downloads against this file.
        working-directory: release
        run: |
          set -euo pipefail
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: release/*
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          body: |
            MultiForge ${{ github.ref_name }} — GPL-3.0-only.

            **Install or update in one line** (from the server directory; Java 21):

            ```
            curl -fsSL https://github.com/${{ github.repository }}/releases/latest/download/multiforge-update.sh | sh
            ```

            Then start the server with `java -Xms4G -Xmx20G -jar server.jar nogui` (or `./run.sh`).
            The updater never touches `config/`, `mods/`, worlds, `server.properties` or `eula.txt`,
            and keeps the previous version for `... | sh -s -- --rollback`.
            See [docs/install.md § Updating](https://github.com/${{ github.repository }}/blob/main/docs/install.md#updating).

            Downloads:
            - `multiforge-update.sh` — the updater above; `server.jar` — NeoForged's
              [server starter](https://github.com/NeoForged/serverstarterjar) (LGPL-2.1, source at that link),
              mirrored unchanged; `multiforge-scanner.jar` — the mod-safety scanner behind
              `/multiforge certify`; `SHA256SUMS` — checksums of every asset.
            - **Fresh installer JAR: `multiforge-*-installer.jar`**
              (stable alias: [multiforge-installer.jar](https://github.com/${{ github.repository }}/releases/latest/download/multiforge-installer.jar))
              Run with `java -jar multiforge-installer.jar --installServer <dir>` —
              standard NeoForge installer CLI. See [docs/install.md § Method 1](https://github.com/${{ github.repository }}/blob/main/docs/install.md#method-1--fresh-installer-jar).
            - **Drop-in replacement ZIP: `multiforge-*-replacement.zip`**
              (stable alias: [multiforge-replacement.zip](https://github.com/${{ github.repository }}/releases/latest/download/multiforge-replacement.zip))
              Unzip into an existing NeoForge 1.21.1 server directory and run
              `./install-multiforge.sh` (Windows: `install-multiforge.bat`) to
              convert it in place — world, mods and configs untouched. See
              [docs/install.md § Method 2](https://github.com/${{ github.repository }}/blob/main/docs/install.md#method-2--drop-in-replacement-zip).
            - Runtime library (for mod authors): `multiforge-runtime-*.jar`
            - **Client debug mod: `multiforge-client-*.jar`**
              (stable alias: [multiforge-client.jar](https://github.com/${{ github.repository }}/releases/latest/download/multiforge-client.jar))
              Optional — drop into your Minecraft client's `mods/` folder
              for the F3 overlay, chunk-border renderer, MSPT heatmap, and
              region-pin selection. Stays inert if the server doesn't
              advertise `multiforge:debug/v1`.
            - Pelican Panel / Pterodactyl egg: `pelican-egg.json`
              (import via panel: Nests → Import Egg — see
              [docs/install.md § Method 3](https://github.com/${{ github.repository }}/blob/main/docs/install.md#method-3--pelican-panel--pterodactyl-egg))

            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for what changed.
