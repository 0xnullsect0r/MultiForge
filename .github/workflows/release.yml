name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/multiforge-server

jobs:
  build-jars:
    name: build release jars
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build all jars
        run: ./gradlew build --no-daemon --stacktrace

      - name: Assemble release bundle
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#v}"
          RELEASE_DIR="release"
          mkdir -p "$RELEASE_DIR"

          # Runtime library — mod authors compile against this.
          cp multiforge-runtime/build/libs/*.jar "$RELEASE_DIR/"
          # License verifier + signer.
          cp multiforge-license/build/libs/*.jar "$RELEASE_DIR/"
          cp multiforge-license-cli/build/distributions/*.tar "$RELEASE_DIR/"

          # Installer + server jar — produced only when the NeoForge
          # workspace is vendored (mc=true). We build them best-effort
          # so a source-only release still ships the runtime jars.
          if [ -d upstream/neoforge-1.21.1 ]; then
            ./gradlew :multiforge-installer:jar :multiforge-installer:serverJar -Pmc=true --no-daemon || true
            find multiforge-installer/build/libs -name '*.jar' -exec cp {} "$RELEASE_DIR/" \; 2>/dev/null || true
          fi

          # Operator install bundle — a self-contained tarball with
          # docker-compose, install script, and every operator-facing
          # doc, so a customer can grab one file and be running.
          BUNDLE_DIR="multiforge-${VER}-install"
          mkdir -p "$BUNDLE_DIR/docs"
          cp docker/docker-compose.yml "$BUNDLE_DIR/"
          cp docker/entrypoint.sh "$BUNDLE_DIR/" 2>/dev/null || true
          cp docs/install.md "$BUNDLE_DIR/docs/"
          cp docs/operator-handbook.md "$BUNDLE_DIR/docs/"
          cp docs/persistence.md "$BUNDLE_DIR/docs/"
          cp docs/regions.md "$BUNDLE_DIR/docs/"
          cp docs/chunks.md "$BUNDLE_DIR/docs/"
          cp docs/migration.md "$BUNDLE_DIR/docs/"
          cp docs/global-network.md "$BUNDLE_DIR/docs/"
          cp docs/license.md "$BUNDLE_DIR/docs/"
          cp docs/README.md "$BUNDLE_DIR/docs/"
          cp scripts/install.sh "$BUNDLE_DIR/install.sh"
          chmod +x "$BUNDLE_DIR/install.sh"
          tar czf "$RELEASE_DIR/${BUNDLE_DIR}.tar.gz" "$BUNDLE_DIR"

          ls -l "$RELEASE_DIR/"

      - name: Upload jars artifact
        uses: actions/upload-artifact@v4
        with:
          name: jars-${{ github.ref_name }}
          path: release/
          retention-days: 30

  build-image:
    name: build + push multi-arch image
    runs-on: ubuntu-latest
    needs: build-jars
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build + push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            MC=false

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image digest
        env:
          COSIGN_EXPERIMENTAL: "true"
        run: |
          echo "${{ steps.meta.outputs.tags }}" | while read -r tag; do
            [ -n "$tag" ] && cosign sign --yes "${tag}@${{ steps.build.outputs.digest }}"
          done

  gh-release:
    name: create GitHub release
    runs-on: ubuntu-latest
    needs: [build-jars, build-image]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Download release bundle
        uses: actions/download-artifact@v4
        with:
          name: jars-${{ github.ref_name }}
          path: release/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
