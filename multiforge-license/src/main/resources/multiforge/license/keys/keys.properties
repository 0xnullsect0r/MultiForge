# MultiForge production Ed25519 license verification public keys.
# One line per key: <kid>=<base64url raw 32-byte public key>
# The private key MUST NOT live in this repository.
#
# No production keys are baked into this pre-alpha build. Attempting to
# start the server without a bundled key will fail with reason UNKNOWN_KID
# for any real token — this is intentional until the purchase site is up.
